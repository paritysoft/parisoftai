name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: RLS policy tests (throwaway PostgreSQL)
        run: npm run test:rls
      - name: Production build (no database — bundled fallback content)
        run: npm run build
      - run: npm audit --omit=dev --audit-level=high
